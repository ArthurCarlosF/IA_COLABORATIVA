name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  distributed-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/data/hf
      HF_HUB_DISABLE_XET: "1"
      MESH_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Prepare real model
        run: python -m mesh prepare
      - name: Unit and distributed integration tests
        run: python -m pytest -q --basetemp=runtime/pytest-ci
      - name: Upload numerical and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: runtime/test-evidence.json
          if-no-files-found: ignore
